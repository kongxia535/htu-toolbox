name: Publish Release

on:
  push:
    tags: ["v*"]
    branches: ["publish/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        id: version
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['GITHUB_REF_NAME']
          if os.environ['GITHUB_REF_TYPE'] == 'branch':
              tag = tag.removeprefix('publish/')
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Invalid release tag'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_TAG=' + tag + '\n')
          PY
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}
      - name: Check release version
        run: |
          python3 - <<'PY'
          import configparser, os
          from pathlib import Path
          version = configparser.ConfigParser(interpolation=None)
          version.read_string('[app]\n' + Path('android/version.properties').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + version.get('app', 'versionName'), 'Tag does not match Android version'
          PY
      - name: Get prepared release files
        uses: actions/checkout@v5
        with:
          ref: release-assets/${{ steps.version.outputs.tag }}
          path: .release-assets
      - name: Verify source and files
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path('.release-assets/release.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert metadata['tag'] == os.environ['RELEASE_TAG'], 'Asset tag mismatch'
          assert metadata['source_commit'] == source, 'Assets belong to a different source commit'
          PY
          cd .release-assets
          sha256sum --check SHA256SUMS
      - name: Publish prepared files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            ".release-assets/htu-connect-$RELEASE_TAG-debug.apk#Android APK（调试签名）" \
            ".release-assets/htu-toolbox-desktop-$RELEASE_TAG.zip#Windows、Linux、macOS 桌面包" \
            ".release-assets/SHA256SUMS#SHA-256 校验文件" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "HTU Connect $RELEASE_TAG · 跨平台测试版" \
            --notes-file .release-assets/RELEASE_NOTES.md
